<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.4/dist/livekit-client.umd.min.js"></script>
  <style>
    body { margin: 0; background: #181c28; color: #dfe5ff; font: 14px Segoe UI; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    .tile { background: #222a3a; border-radius: 12px; min-height: 180px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .label { position: absolute; left: 12px; bottom: 10px; background: #0009; padding: 5px 8px; border-radius: 6px; z-index: 1; }
  </style>
</head>
<body>
  <div class="tile"><span class="label">Bạn</span><video id="local" autoplay muted playsinline></video></div>
  <div class="tile" id="remoteTile"><span class="label">Người gọi</span><span>Đang chờ người khác vào kênh...</span></div>
  <script>
    let room = null;
    let microphoneEnabled = false, cameraEnabled = false;
    let microphoneTestStream = null, microphoneTestContext = null, microphoneTestAnalyser = null, microphoneTestFrame = null;
    const send = message => window.chrome.webview.postMessage(message);
    const state = () => send({ type: 'device', microphoneEnabled, cameraEnabled });
    function attachRemoteTrack(track, publication, participant) {
      const tile = document.getElementById('remoteTile');
      if (tile.querySelector(`[data-sid="${publication.trackSid}"]`)) return;
      if (tile.querySelector('.waiting')) tile.querySelector('.waiting').remove();
      const element = track.attach();
      element.dataset.sid = publication.trackSid;
      element.autoplay = true;
      element.playsInline = true;
      tile.querySelector('.label').textContent = participant.identity;
      tile.appendChild(element);
    }
    function removeRemoteTrack(track) { track.detach().forEach(element => element.remove()); }
    function attachLocalVideo(track) {
      const local = document.getElementById('local');
      track.attach(local);
      local.play().catch(() => {});
    }
    async function connectLiveKit(url, token) {
      try {
        if (!window.LivekitClient) throw new Error('Không tải được LiveKit SDK từ CDN');
        room = new LivekitClient.Room();
        room.on(LivekitClient.RoomEvent.TrackSubscribed, attachRemoteTrack);
        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, removeRemoteTrack);
        await room.connect(url, token);
        for (const participant of room.remoteParticipants.values()) {
          for (const publication of participant.trackPublications.values()) {
            if (publication.track) attachRemoteTrack(publication.track, publication, participant);
          }
        }
        send({ type: 'livekit', status: 'connected' });
      } catch (error) {
        send({ type: 'error', message: 'LiveKit không kết nối được: ' + (error?.message || error) });
      }
    }
    async function testMicrophone() {
      if (microphoneTestStream) { stopMicrophoneTest(); return; }
      try {
        microphoneTestStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphoneTestContext = new AudioContext();
        microphoneTestAnalyser = microphoneTestContext.createAnalyser();
        microphoneTestAnalyser.fftSize = 256;
        microphoneTestContext.createMediaStreamSource(microphoneTestStream).connect(microphoneTestAnalyser);
        send({ type: 'mic-test', running: true, level: 0 });
        measureMicrophone();
      } catch (error) { send({ type: 'error', message: 'Không truy cập được microphone: ' + error.message }); }
    }
    function measureMicrophone() {
      if (!microphoneTestAnalyser) return;
      const values = new Uint8Array(microphoneTestAnalyser.frequencyBinCount);
      microphoneTestAnalyser.getByteTimeDomainData(values);
      let peak = 0;
      for (const value of values) peak = Math.max(peak, Math.abs(value - 128));
      send({ type: 'mic-test', running: true, level: Math.min(100, Math.round(peak * 2.5)) });
      microphoneTestFrame = requestAnimationFrame(measureMicrophone);
    }
    function stopMicrophoneTest() {
      if (microphoneTestFrame) cancelAnimationFrame(microphoneTestFrame);
      if (microphoneTestStream) microphoneTestStream.getTracks().forEach(track => track.stop());
      if (microphoneTestContext) microphoneTestContext.close();
      microphoneTestStream = null; microphoneTestContext = null; microphoneTestAnalyser = null; microphoneTestFrame = null;
      send({ type: 'mic-test', running: false, level: 0 });
    }
    async function toggleMicrophone() { try { if (!room) throw new Error('LiveKit chưa kết nối'); microphoneEnabled = !microphoneEnabled; await room.localParticipant.setMicrophoneEnabled(microphoneEnabled); state(); } catch (error) { send({ type: 'error', message: 'Không truy cập được microphone: ' + error.message }); } }
    async function toggleCamera() { try { if (!room) throw new Error('LiveKit chưa kết nối'); cameraEnabled = !cameraEnabled; await room.localParticipant.setCameraEnabled(cameraEnabled); const publication = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera); if (cameraEnabled && publication?.track) attachLocalVideo(publication.track); state(); } catch (error) { send({ type: 'error', message: 'Không truy cập được camera: ' + error.message }); } }
    window.live = { connectLiveKit, toggleMicrophone, toggleCamera, testMicrophone, stopMicrophoneTest };
  </script>
</body>
</html>
